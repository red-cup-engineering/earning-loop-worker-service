name: Native earning-loop source and Worker receiving
on:
  pull_request:
  push:
    branches: [main, feat/self-hosted-agent-market-watch-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source contract without credentials or registry packages
        run: |
          node --check src/agent-market-observation.mjs
          node --check test/agent-market-source-qualification.test.mjs
          node --test test/agent-market-source-qualification.test.mjs
  reconcile-lockfile:
    # Only the original owned review branch may perform this known,
    # bounded, source-only lock regeneration. PRs and main remain read-only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/self-hosted-agent-market-watch-20261024'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use native source-pinned package manager
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-tool"
          npm install --prefix "$RUNNER_TEMP/pnpm-tool" --registry=https://registry.npmjs.org \
            --no-save --ignore-scripts --no-audit --no-fund pnpm@11.19.0
      - name: Regenerate from original manifest using native pnpm, retaining the source lock
        run: |
          set -euo pipefail
          cp pnpm-lock.yaml "$RUNNER_TEMP/original-pnpm-lock.yaml"
          node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" clean --lockfile
          node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" install \
            --lockfile-only --ignore-scripts --no-frozen-lockfile
          test -s pnpm-lock.yaml
          git diff --check -- pnpm-lock.yaml
          test -z "$(git status --porcelain -- . ':!pnpm-lock.yaml')"
      - name: Independently receive the regenerated exact closure and original complete Worker
        run: |
          node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" install \
            --frozen-lockfile --ignore-scripts
          npm run check
          npm test
      - name: Source-own the actual deterministic lock revision
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git add -- pnpm-lock.yaml
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Receive exact pruned Worker pnpm closure after source dependency removal'
          git push origin HEAD:refs/heads/feat/self-hosted-agent-market-watch-20261024
  native-worker:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact source-owned package manager outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/pnpm-tool"
          npm install --prefix "$RUNNER_TEMP/pnpm-tool" --registry=https://registry.npmjs.org \
            --no-save --ignore-scripts --no-audit --no-fund pnpm@11.19.0
      - name: Receive original frozen pnpm dependency closure
        run: node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" install --frozen-lockfile --ignore-scripts
      - name: Qualify actual native Worker source
        run: npm run check && npm test
